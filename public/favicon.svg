<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1408" />
      <stop offset="50%" stop-color="#0E0C08" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6514" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#CCCCCC" />
      <stop offset="100%" stop-color="#777777" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE07A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#553F10" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="4" />

  <!-- Inner P Mark: Gold Geometric Loop -->
  <path
    d="M34 26 H74 C92 26 98 38 98 52 C98 66 88 78 72 78 H54 V102 H34 Z"
    fill="url(#goldGrad)"
  />

  <!-- Inner Counter Cutout -->
  <path
    d="M54 42 H72 C80 42 82 46 82 52 C82 58 79 62 72 62 H54 Z"
    fill="#0E0C08"
  />

  <!-- Lower-Right Silver 3D Chevron Accent -->
  <path
    d="M68 80 L94 80 L76 102 L52 102 Z"
    fill="url(#silverGrad)"
    opacity="0.95"
  />
</svg>
